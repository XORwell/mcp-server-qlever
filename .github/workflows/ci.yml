name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: npm run test:integration
      - run: docker compose -f docker-compose.test.yml down -v

  # E2E tests require GND data fixture (generated locally, not in CI).
  # The tests skip gracefully when QLever is unavailable.
  # Run locally with: npm run test:ci:gnd

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mcp-server-qlever:ci .
      - run: docker run --rm mcp-server-qlever:ci --version
      - run: docker run --rm mcp-server-qlever:ci --help
